# Compose file for Dokploy (or any host that puts Traefik in front of you).
#
# Differences from docker-compose.yml, which stays the file to use locally:
#   - named volume instead of "./data", because the bind mount would be created
#     root-owned on the host and the image runs as uid 1000, so SQLite could not
#     write /data/boop.db.
#   - joins the external dokploy-network so Traefik can route your domain here.
#   - no published port: Traefik reaches 8080 over that network. Publishing it
#     would also expose the server on the host's public IP, past your HTTPS
#     proxy and past the admin login.
#
# Set APNS_* in Dokploy's Environment tab, not here. Use APNS_PRIVATE_KEY with
# the base64 of your .p8 and leave APNS_PRIVATE_KEY_PATH unset -- when the path
# is set it wins over the inline key, and the file does not exist here.
services:
  boop:
    build:
      context: ./server
    image: ghcr.io/chrisgreg/boop:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - "boop-data:/data"
    env_file:
      - path: .env
        required: false
    environment:
      BOOP_DATABASE_PATH: /data/boop.db
    networks:
      - dokploy-network

volumes:
  boop-data:

networks:
  dokploy-network:
    external: true
