name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
        working-directory: server/web
      - run: npm run check
        working-directory: server/web
      - run: npx vitest run
        working-directory: server/web
      - run: npm run build
        working-directory: server/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: server/internal/web/dist

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/web/dist
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
      - run: CGO_ENABLED=0 go build -o /tmp/boop ./cmd/boop
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: boop:ci
